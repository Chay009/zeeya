plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.anonymous.zeeya'
version = '1.0.0'

android {
  namespace 'expo.modules.zeeyamessagequeue'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // HeadlessJsTaskService, for parsing a new SMS while the app is in the background.
  compileOnly 'com.facebook.react:react-android'
}
